openapi: 3.0.3
info:
  title: SahajTest Platform API
  version: 2.3.0
  description: REST API for SahajTest academic structures, canonical question bank,
    and structured paper delivery foundation.
paths:
  /api/v1/academics/curricula/:
    get:
      operationId: v1_academics_curricula_list
      description: Retrieve curricula filtered by provider_id, curriculum_type, or
        search query.
      summary: List curricula
      parameters:
      - in: query
        name: curriculum_type
        schema:
          type: string
          enum:
          - COMPETITIVE_EXAM
          - CORPORATE_TRAINING
          - OTHER
          - PROFESSIONAL_CERTIFICATION
          - SCHOOL
          - UNIVERSITY
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: provider_id
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCurriculumList'
          description: ''
    post:
      operationId: v1_academics_curricula_create
      description: ADMIN only. Creates a new Curriculum under a provider.
      summary: Create a curriculum
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Curriculum'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Curriculum'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Curriculum'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curriculum'
          description: ''
        '400':
          description: Validation error.
        '403':
          description: Forbidden - Admin rights required.
  /api/v1/academics/curricula/{id}/:
    get:
      operationId: v1_academics_curricula_retrieve
      description: Retrieve curriculum detail by ID.
      summary: Retrieve curriculum detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curriculum'
          description: ''
        '404':
          description: Curriculum not found.
  /api/v1/academics/curriculum-subjects/:
    post:
      operationId: v1_academics_curriculum_subjects_create
      description: ADMIN only. Attach a Subject to a CurriculumVersion.
      summary: Attach subject to a curriculum version
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurriculumSubject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CurriculumSubject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CurriculumSubject'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumSubject'
          description: ''
        '400':
          description: Validation error.
        '403':
          description: Forbidden - Admin rights required.
  /api/v1/academics/curriculum-subjects/{id}/syllabus/:
    get:
      operationId: v1_academics_curriculum_subjects_syllabus_list
      description: Returns the full hierarchical syllabus tree for a curriculum subject
        with ZERO N+1 queries.
      summary: Retrieve complete syllabus tree
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyllabusNodeTree'
          description: ''
  /api/v1/academics/providers/:
    get:
      operationId: v1_academics_providers_list
      description: Retrieve active education providers with optional provider_type
        and search filters.
      summary: List education providers
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: provider_type
        schema:
          type: string
          enum:
          - CERTIFICATION_BODY
          - CORPORATE
          - EXAM_AUTHORITY
          - GOVERNMENT
          - OTHER
          - SCHOOL_BOARD
          - UNIVERSITY
      - in: query
        name: search
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEducationProviderList'
          description: ''
    post:
      operationId: v1_academics_providers_create
      description: ADMIN only. Creates a new generic EducationProvider.
      summary: Create an education provider
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EducationProvider'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EducationProvider'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EducationProvider'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationProvider'
          description: ''
        '400':
          description: Validation error.
        '403':
          description: Forbidden - Admin rights required.
  /api/v1/academics/providers/{id}/:
    get:
      operationId: v1_academics_providers_retrieve
      description: Retrieve an education provider by ID.
      summary: Retrieve an education provider detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationProvider'
          description: ''
        '404':
          description: Provider not found.
  /api/v1/academics/syllabus-nodes/:
    post:
      operationId: v1_academics_syllabus_nodes_create
      description: ADMIN only. Creates a new node in the syllabus hierarchy.
      summary: Create a syllabus node
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyllabusNode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SyllabusNode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SyllabusNode'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyllabusNode'
          description: ''
        '400':
          description: Validation error.
        '403':
          description: Forbidden - Admin rights required.
  /api/v1/academics/syllabus-nodes/{id}/:
    get:
      operationId: v1_academics_syllabus_nodes_retrieve
      description: Retrieve or update (move) a syllabus node (ADMIN only for write).
      summary: Retrieve syllabus node detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyllabusNode'
          description: ''
        '404':
          description: SyllabusNode not found.
    patch:
      operationId: v1_academics_syllabus_nodes_partial_update
      description: ADMIN only. Move node to a new parent or sequence position.
      summary: Update or move a syllabus node
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSyllabusNode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSyllabusNode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSyllabusNode'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyllabusNode'
          description: ''
        '400':
          description: Validation error.
        '403':
          description: Forbidden - Admin rights required.
        '404':
          description: Node not found.
  /api/v1/academics/versions/:
    post:
      operationId: v1_academics_versions_create
      description: ADMIN only. Create a version for a curriculum.
      summary: Create a curriculum version
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurriculumVersion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CurriculumVersion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CurriculumVersion'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumVersion'
          description: ''
        '400':
          description: Validation error.
        '403':
          description: Forbidden - Admin rights required.
  /api/v1/academics/versions/{id}/:
    get:
      operationId: v1_academics_versions_retrieve
      description: Retrieve curriculum version detail by ID.
      summary: Retrieve curriculum version detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumVersion'
          description: ''
        '404':
          description: Version not found.
  /api/v1/academics/versions/{id}/subjects/:
    get:
      operationId: v1_academics_versions_subjects_list
      description: Returns list of CurriculumSubjects attached to the specified version
        in sequence order.
      summary: Retrieve subjects for a curriculum version
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurriculumSubject'
          description: ''
        '404':
          description: Version not found.
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Authenticates user credentials and returns JWT access and refresh
        tokens containing role and exam claims.
      summary: Obtain JWT token pair
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainResponse'
          description: ''
        '400':
          description: Bad Request - Missing username or password.
        '401':
          description: Unauthorized - Invalid credentials provided.
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Blacklists the submitted refresh token, preventing its future reuse.
      summary: Logout user and revoke refresh token
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccessResponse'
          description: ''
        '400':
          description: Invalid, missing, or blacklisted refresh token.
  /api/v1/auth/profile/:
    get:
      operationId: v1_auth_profile_retrieve
      description: Returns profile metrics, target exam preferences, and login telemetry
        for the authenticated user.
      summary: Retrieve user profile
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '401':
          description: Unauthorized - Invalid or missing Bearer token.
    patch:
      operationId: v1_auth_profile_partial_update
      description: Partially update user target goals, phone number, and instruction
        medium.
      summary: Update user profile
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Bad Request - Invalid field data.
        '401':
          description: Unauthorized - Invalid or missing Bearer token.
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: 'Exchanges a valid refresh token for a new 60-minute access token.
        Note: Refresh token rotation is disabled; the original refresh token remains
        valid until its 24-hour expiration or until revoked via logout.'
      summary: Refresh JWT access token
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '400':
          description: Bad Request - Missing refresh token field.
        '401':
          description: Unauthorized - Invalid, expired, or blacklisted refresh token.
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: Creates a new student/user profile, validates password strength,
        and issues JWT access and refresh tokens.
      summary: Register a new user
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
          description: ''
        '400':
          description: Validation Error - Invalid input parameters or existing user
            data.
  /api/v1/auth/verify/:
    post:
      operationId: v1_auth_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
  /api/v1/classrooms/:
    get:
      operationId: v1_classrooms_list
      description: Retrieve classrooms owned by teacher/admin or enrolled by student.
      summary: List user classrooms
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Classroom'
          description: ''
    post:
      operationId: v1_classrooms_create
      description: Create a new classroom group (Teachers or Admins only).
      summary: Create classroom
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassroom'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateClassroom'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateClassroom'
        required: true
      security:
      - jwtAuth: []
      responses:
        '211':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classroom'
          description: ''
        '400':
          description: Validation error
  /api/v1/classrooms/{id}/:
    get:
      operationId: v1_classrooms_retrieve
      description: Retrieve detail for a classroom if user is owner, enrolled student,
        or admin.
      summary: Get classroom detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classroom'
          description: ''
  /api/v1/classrooms/{id}/assignments/:
    get:
      operationId: v1_classrooms_assignments_list
      description: Retrieve assignments created for a specific classroom.
      summary: List classroom assignments
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassroomAssignment'
          description: ''
    post:
      operationId: v1_classrooms_assignments_create
      description: Assign a published PaperVersion to a classroom with schedule window.
      summary: Create classroom assignment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassroomAssignment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateClassroomAssignment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateClassroomAssignment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '211':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomAssignment'
          description: ''
  /api/v1/classrooms/{id}/assignments/{assignment_id}/report/:
    get:
      operationId: v1_classrooms_assignments_report_retrieve
      description: Retrieve factual roster submission breakdown & score stats (Teachers/Admins
        only).
      summary: Get operational assignment report
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Operational report dictionary
  /api/v1/classrooms/{id}/roster/:
    get:
      operationId: v1_classrooms_roster_list
      description: Retrieve full roster member identities (Teachers/Admins only).
      summary: Get classroom roster
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassroomRosterMember'
          description: ''
  /api/v1/classrooms/join/:
    post:
      operationId: v1_classrooms_join_create
      description: Enroll student into a classroom using an 8-character invite code.
      summary: Join classroom
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinClassroom'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JoinClassroom'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JoinClassroom'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Enrolled successfully
  /api/v1/learner/academic-profile/:
    get:
      operationId: v1_learner_academic_profile_retrieve
      description: Returns student primary curriculum target version and active exploration
        context.
      summary: Retrieve learner academic profile
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerAcademicProfile'
          description: ''
    patch:
      operationId: v1_learner_academic_profile_partial_update
      description: Sets student primary curriculum target. Automatically initializes
        active exploration context if unset.
      summary: Set primary curriculum target version
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSetPrimaryCurriculumVersionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSetPrimaryCurriculumVersionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSetPrimaryCurriculumVersionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerAcademicProfile'
          description: ''
        '400':
          description: Bad Request.
  /api/v1/learner/academic-profile/switch-context/:
    post:
      operationId: v1_learner_academic_profile_switch_context_create
      description: Switches learner active curriculum context without modifying their
        primary target.
      summary: Switch active curriculum exploration context
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchActiveContextRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SwitchActiveContextRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SwitchActiveContextRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Updated learner profile details.
  /api/v1/learner/assignments/:
    get:
      operationId: v1_learner_assignments_list
      description: Retrieve active classroom assignments for enrolled student.
      summary: List assigned papers
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassroomAssignment'
          description: ''
  /api/v1/learner/assignments/{id}/start-attempt/:
    post:
      operationId: v1_learner_assignments_start_attempt_create
      description: Initialize or resume a PaperAttempt for a classroom assignment.
