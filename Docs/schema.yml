      - curriculum_subject_name
      - curriculum_version_title
      - id
      - member_count
      - name
      - owner
      - owner_name
      - owner_username
    ClassroomAssignment:
      type: object
      description: Serializer for listing classroom assignments.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        classroom:
          type: string
          format: uuid
        classroom_name:
          type: string
          readOnly: true
        paper_version:
          type: string
          format: uuid
        paper_title:
          type: string
          readOnly: true
        version_number:
          type: integer
          readOnly: true
        delivery_configuration:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 255
        instructions:
          type: string
        start_at:
          type: string
          format: date-time
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        allow_late_submission:
          type: boolean
        is_published:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - classroom
      - classroom_name
      - created_at
      - delivery_configuration
      - id
      - paper_title
      - paper_version
      - title
      - version_number
    ClassroomRosterMember:
      type: object
      description: Serializer for roster member identity visible ONLY to teachers
        and admins.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        student:
          type: integer
        student_username:
          type: string
          readOnly: true
        student_email:
          type: string
          readOnly: true
        student_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/ClassroomRosterMemberStatusEnum'
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - joined_at
      - student
      - student_email
      - student_name
      - student_username
    ClassroomRosterMemberStatusEnum:
      enum:
      - ACTIVE
      - INVITED
      - DROPPED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `INVITED` - Invited
        * `DROPPED` - Dropped
    CreateClassroom:
      type: object
      description: Serializer for creating a new classroom.
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
        curriculum_version:
          type: string
          format: uuid
          nullable: true
        curriculum_subject:
          type: string
          format: uuid
          nullable: true
      required:
      - name
    CreateClassroomAssignment:
      type: object
      description: Serializer for teacher creating a classroom assignment.
      properties:
        paper_version_id:
          type: string
          format: uuid
        delivery_configuration_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 255
        instructions:
          type: string
          default: ''
        start_at:
          type: string
          format: date-time
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        allow_late_submission:
          type: boolean
          default: false
      required:
      - delivery_configuration_id
      - paper_version_id
      - title
    Curriculum:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        provider:
          allOf:
          - $ref: '#/components/schemas/EducationProvider'
          readOnly: true
        provider_id:
          type: string
          format: uuid
          writeOnly: true
        name:
          type: string
          maxLength: 255
        code:
          type: string
          description: Program code, unique within provider.
          maxLength: 100
        curriculum_type:
          $ref: '#/components/schemas/CurriculumTypeEnum'
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - curriculum_type
      - id
      - name
      - provider
      - provider_id
      - updated_at
    CurriculumSubject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        curriculum_version_id:
          type: string
          format: uuid
          writeOnly: true
        subject:
          allOf:
          - $ref: '#/components/schemas/Subject'
          readOnly: true
        subject_id:
          type: string
          format: uuid
          writeOnly: true
        display_name:
          type: string
          nullable: true
          maxLength: 255
        sequence:
          type: integer
