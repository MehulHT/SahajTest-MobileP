components:
  schemas:
    AccuracySummary:
      type: object
      description: Summary metrics of user question attempts.
      properties:
        total_attempts:
          type: integer
        unique_questions_attempted:
          type: integer
        correct_attempts:
          type: integer
        incorrect_attempts:
          type: integer
        unique_questions_correct:
          type: integer
        accuracy_percentage:
          type: number
          format: double
        average_actual_seconds:
          type: number
          format: double
          nullable: true
        average_target_seconds:
          type: number
          format: double
          nullable: true
        average_speed_ratio:
          type: number
          format: double
          nullable: true
      required:
      - accuracy_percentage
      - average_actual_seconds
      - average_speed_ratio
      - average_target_seconds
      - correct_attempts
      - incorrect_attempts
      - total_attempts
      - unique_questions_attempted
      - unique_questions_correct
    AttemptAnalyticsFilters:
      type: object
      description: Applied filters in analytics response.
      properties:
        subject:
          type: string
          nullable: true
      required:
      - subject
    AttemptAnalyticsResponse:
      type: object
      description: Complete attempt analytics payload response contract.
      properties:
        filters:
          $ref: '#/components/schemas/AttemptAnalyticsFilters'
        summary:
          $ref: '#/components/schemas/AccuracySummary'
        speed_distribution:
          $ref: '#/components/schemas/SpeedDistribution'
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectAnalyticsItem'
        subtopics:
          type: array
          items:
            $ref: '#/components/schemas/SubtopicAnalyticsItem'
      required:
      - filters
      - speed_distribution
      - subjects
      - subtopics
      - summary
    AttemptResponse:
      type: object
      properties:
        attempt:
          $ref: '#/components/schemas/QuestionAttemptDetail'
        is_correct:
          type: boolean
        solution_text:
          type: string
      required:
      - attempt
      - is_correct
      - solution_text
    AttemptResult:
      type: object
      description: Serializer for paper attempt scoring and result summary.
      properties:
        attempt_id:
          type: string
          format: uuid
        paper_id:
          type: string
          format: uuid
        paper_title:
          type: string
        version_number:
          type: integer
        status:
          type: string
        submission_reason:
          type: string
        submitted_at:
          type: string
          format: date-time
          nullable: true
        result_released_at:
          type: string
          format: date-time
          nullable: true
        is_result_released:
          type: boolean
        pending_manual_evaluation:
          type: boolean
        pending_manual_count:
          type: integer
        raw_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          nullable: true
        maximum_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          nullable: true
        correct_count:
          type: integer
          nullable: true
        incorrect_count:
          type: integer
          nullable: true
        unanswered_count:
          type: integer
          nullable: true
        section_scores_breakdown:
          type: object
          additionalProperties: {}
      required:
      - attempt_id
      - correct_count
      - incorrect_count
      - is_result_released
      - maximum_score
      - paper_id
      - paper_title
      - pending_manual_count
      - pending_manual_evaluation
      - raw_score
      - result_released_at
      - section_scores_breakdown
      - status
      - submission_reason
      - submitted_at
      - unanswered_count
      - version_number
    AttemptReviewPayload:
      type: object
      description: Payload for whole-paper review and solutions.
      properties:
        attempt_id:
          type: string
          format: uuid
        status:
          type: string
        result_released_at:
          type: string
          format: date-time
          nullable: true
        solution_released_at:
          type: string
          format: date-time
          nullable: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQuestionItem'
      required:
      - attempt_id
      - questions
      - result_released_at
      - solution_released_at
      - status
    BlankEnum:
      enum:
      - ''
    CanonicalQuestionCreate:
      type: object
      description: Serializer for creating a new canonical question draft through
        QuestionService.
      properties:
        id:
          type: integer
          readOnly: true
        sub_topic:
          type: integer
        syllabus_node:
          type: string
          format: uuid
          nullable: true
        question_text:
          type: string
        options:
          description: 'List of option objects, e.g., [{''id'': ''A'', ''text'': ''Option
            A''}]'
        correct_option_id:
          type: string
          maxLength: 50
        question_type:
          allOf:
          - $ref: '#/components/schemas/QuestionTypeEnum'
          default: SINGLE_CHOICE
        difficulty:
          allOf:
          - $ref: '#/components/schemas/DifficultyEnum'
          default: MEDIUM
        target_time_seconds:
          type: integer
          maximum: 2147483647
          minimum: 0
          default: 120
        marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          default: '4.00'
        negative_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          default: '1.00'
        language_code:
          type: string
          default: en
          maxLength: 10
        instructions:
          type: string
        explanation:
          type: string
        hint:
          type: string
        source_type:
          allOf:
          - $ref: '#/components/schemas/SourceTypeEnum'
          default: MANUAL
        source_name:
          type: string
          maxLength: 255
        source_authority:
          type: string
          maxLength: 100
        source_reference:
          type: string
          maxLength: 255
        source_url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        exam_year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        is_must_do_pyq:
          type: boolean
        target_exam:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TargetExamEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/StatusCd9Enum'
          readOnly: true
        fingerprint:
          type: string
          readOnly: true
          description: SHA-256 hex fingerprint of normalized educational core identity.
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - correct_option_id
      - created_at
      - created_by
      - fingerprint
      - id
      - question_text
      - status
      - sub_topic
    CanonicalQuestionCreateResponse:
      type: object
      properties:
        question:
          $ref: '#/components/schemas/Question'
        duplicate_result:
          type: object
          additionalProperties: {}
      required:
      - duplicate_result
      - question
    Chapter:
      type: object
      description: Serializer for syllabus chapters with nested sub-topics.
      properties:
        id:
          type: integer
          readOnly: true
        subject:
          $ref: '#/components/schemas/SubjectEnum'
        name:
          type: string
          maxLength: 255
        order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        sub_topics:
          type: array
          items:
            $ref: '#/components/schemas/SubTopic'
          readOnly: true
      required:
      - id
      - name
      - sub_topics
      - subject
    Classroom:
      type: object
